# compose-launcher config for CS449UmpireBuddy (https://github.com/Nate314/CS449UmpireBuddy)
# The launcher requires at least one port line, but this Android build serves nothing.
# UNUSED_PORT only satisfies that rule: docker-compose.yml does not read it and publishes no ports.
port UNUSED_PORT 8080

url No web page: the container runs the unit tests, builds the debug APK once and exits.
url APK:    app/build/outputs/apk/debug/app-debug.apk
url Output: .\run.ps1 logs -f build   or   ./run.sh logs -f build
